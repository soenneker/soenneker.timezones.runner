name: daily-automatic-update
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:

  daily-automatic-update:
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v7

      - name: Setting up build version
        run: |
          version=$(($GITHUB_RUN_NUMBER))
          echo "BUILD_VERSION=4.0.$version" >> ${GITHUB_ENV}

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf -- \
            /opt/ghc \
            /opt/google/chrome \
            /opt/hostedtoolcache \
            /opt/microsoft/msedge \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift

          sudo apt-get clean

          echo "Disk space after cleanup:"
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Install dependencies with retry
        run: |
          retries=5
          base_wait_time=15
          exponent=2

          for i in $(seq 1 $retries); do
            if dotnet restore; then
              break
            fi

            if [ $i -lt $retries ]; then
              wait_time=$(awk "BEGIN {print int($base_wait_time * ($exponent ^ ($i - 1)))}")
              echo "dotnet restore failed, retrying in $wait_time seconds..."
              sleep $wait_time
            else
              echo "dotnet restore failed after $retries retries."
              exit 1
            fi
          done

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Generate and pack dataset
        id: prepare
        run: |
          dotnet run --project src/Soenneker.TimeZones.Runner/Soenneker.TimeZones.Runner.csproj --no-build --no-restore --framework net10.0 -c Release -- --prepare-publication artifacts/publication.json
          if [ -f artifacts/publication.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "package_path=$(jq -r '.PackagePath' artifacts/publication.json)" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH__TOKEN: ${{ secrets.GH__TOKEN }}
          GIT__NAME: ${{ secrets.GIT__NAME }}
          GIT__EMAIL: ${{ secrets.GIT__EMAIL }}

      # Request the one-hour credential only after downloading, filtering and packing.
      - name: Log in to NuGet
        if: steps.prepare.outputs.ready == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: soenneker

      - name: Publish prepared dataset
        if: steps.prepare.outputs.ready == 'true'
        run: dotnet run --project src/Soenneker.TimeZones.Runner/Soenneker.TimeZones.Runner.csproj --no-build --no-restore --framework net10.0 -c Release -- --publish-publication artifacts/publication.json
        env:
          GH__USERNAME: ${{ secrets.GH__USERNAME }}
          GH__TOKEN: ${{ secrets.GH__TOKEN }}
          GIT__TOKEN: ${{ secrets.GIT__TOKEN }}
          GIT__NAME: ${{ secrets.GIT__NAME }}
          GIT__EMAIL: ${{ secrets.GIT__EMAIL }}
          NUGET__TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Preserve package if publication fails
        if: failure() && steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timezone-package-${{ env.BUILD_VERSION }}
          path: ${{ steps.prepare.outputs.package_path }}
          if-no-files-found: error
