name: daily-automatic-update
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  daily-automatic-update:
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v7

      - name: Setting up build version
        run: |
          version=$(($GITHUB_RUN_NUMBER))
          echo "BUILD_VERSION=4.0.$version" >> ${GITHUB_ENV}

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf -- \
            /opt/ghc \
            /opt/google/chrome \
            /opt/hostedtoolcache \
            /opt/microsoft/msedge \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift

          sudo apt-get clean

          echo "Disk space after cleanup:"
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies with retry
        run: |
          retries=5
          base_wait_time=15
          exponent=2

          for i in $(seq 1 $retries); do
            if dotnet restore; then
              break
            fi

            if [ $i -lt $retries ]; then
              wait_time=$(awk "BEGIN {print int($base_wait_time * ($exponent ^ ($i - 1)))}")
              echo "dotnet restore failed, retrying in $wait_time seconds..."
              sleep $wait_time
            else
              echo "dotnet restore failed after $retries retries."
              exit 1
            fi
          done

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run
        run: dotnet run --project src/Soenneker.TimeZones.Runner/Soenneker.TimeZones.Runner.csproj --no-restore --verbosity normal --framework net10.0 -c Release
        env:
          GH__USERNAME: ${{ secrets.GH__USERNAME }}
          GH__TOKEN: ${{ secrets.GH__TOKEN }}
          GIT__TOKEN: ${{ secrets.GIT__TOKEN }}
          GIT__NAME: ${{ secrets.GIT__NAME }}
          GIT__EMAIL: ${{ secrets.GIT__EMAIL }}
          NUGET__TOKEN: ${{ secrets.NUGET__TOKEN }}
